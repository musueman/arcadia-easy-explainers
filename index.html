<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="비레스 세계관 공개 자료실">
  <title>비레스 세계관 공개 자료실</title>
  <style>
    :root {
      --ink: #17211d;
      --muted: #65706a;
      --paper: #fffdf7;
      --line: #d7cbb8;
      --green: #275b43;
      --gold: #b4833d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(20, 30, 24, 0.72), rgba(20, 30, 24, 0.18)),
        url("./viewer/assets/illustrations/ck5083-regions-nations-culture-zones-environment-sheet-v1.png") center/cover fixed,
        #ebe3d4;
      font-family: "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      line-height: 1.68;
      word-break: keep-all;
    }
    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: min(12vh, 96px) 0 56px;
    }
    .panel {
      max-width: 760px;
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 10px;
      background: rgba(255, 253, 247, 0.93);
      box-shadow: 0 22px 70px rgba(14, 22, 17, 0.28);
      backdrop-filter: blur(16px);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 900;
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 78px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    p {
      margin: 18px 0 0;
      color: #29342f;
      font-size: 18px;
    }
    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 30px;
    }
    a {
      display: block;
      min-height: 64px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--paper);
      text-decoration: none;
      font-weight: 900;
    }
    a.primary {
      color: #fffdf7;
      background: var(--green);
      border-color: var(--green);
    }
    a span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    a.primary span { color: rgba(255, 253, 247, 0.78); }
    @media (max-width: 700px) {
      body { background-attachment: scroll; }
      .links { grid-template-columns: 1fr; }
      p { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <p class="eyebrow">비레스 5083 공개 자료</p>
      <h1>비레스에 들어가기 전, 먼저 세계의 표면을 읽어보세요.</h1>
      <p>
        이곳은 챗봇 유저가 확인할 수 있는 공개 안내 페이지입니다.
        숨은 정답을 모두 공개하는 백과가 아니라, 각 권역에서 무엇을 보고 듣고 겪게 되는지 보여주는 입구입니다.
      </p>
      <div class="links">
        <a class="primary" href="./vireth-guide/">비레스 여행 안내서<span>권역, 생활, 역사 기억, 플레이 표면</span></a>
        <a href="./viewer/Arcadia_Markdown_Viewer.html">마크다운 자료실<span>정본, 해설본, 도식 자료 열람</span></a>
        <a href="./viewer/Arcadia_Markdown_Viewer.html?file=Arcadia_%EC%89%AC%EC%9A%B4%ED%95%B4%EC%84%A4%EB%B3%B8_v4.md">쉬운 해설본<span>정본 내용을 생활어로 풀어 쓴 문서</span></a>
        <a href="./viewer/Arcadia_Markdown_Viewer.html?file=Arcadia_%EB%A3%A8%EB%82%98%ED%86%A1_%EC%84%B8%EA%B3%84%EA%B4%80DB_%EC%8B%A4%ED%88%AC%EC%9E%85_v11.md">루나톡 세계관본<span>챗봇 투입용 세계관 문서</span></a>
      </div>
    </section>
  </main>
</body>
</html>
